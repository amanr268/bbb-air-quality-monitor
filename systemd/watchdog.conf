# Hardware watchdog (AM335x WDT1, omap_wdt): systemd pets /dev/watchdog1.
# /dev/watchdog (= watchdog0) is softdog, a kernel timer that dies with the
# kernel, so the OMAP one is named explicitly.
# If the kernel or systemd itself hangs, the SoC resets after 30 s.
# Install:  sudo mkdir -p /etc/systemd/system.conf.d
#           sudo cp systemd/watchdog.conf /etc/systemd/system.conf.d/
[Manager]
WatchdogDevice=/dev/watchdog1
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
