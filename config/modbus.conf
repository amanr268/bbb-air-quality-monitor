# Modbus RTU slave (read by aqm_report at start-up; restart aqm after editing)
# RS485 through UART4 (P9.13 TX, P9.11 RX) and the auto-direction transceiver.
# Register map: common/include/aqm/modbus.h (FC 03 / 04, registers 0..24)
enabled = 1
device  = /dev/ttyS4
baud    = 9600
parity  = N        # N (8N2, per Modbus spec), E (8E1, Modbus default) or O
id      = 1        # slave address 1..247
