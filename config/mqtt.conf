# MQTT publishing (read by aqm_report at start-up; restart aqm after editing)
# Topics: <topic>/status  "online"/"offline" (retained, last will)
#         <topic>/sample  every sample, JSON, QoS 0
#         <topic>/avg     averages + 24 h AQI every minute, JSON, QoS 1, retained
#         <topic>/alarm   alarms, JSON, QoS 1
enabled   = 1
host      = 192.168.1.4       # broker: the Mac (IP reserved in the router)
port      = 1883
topic     = aqm/bbb-aqi
keepalive = 30
# username = aqm
# password = secret
