# Board-local MQTT broker (install as /etc/mosquitto/conf.d/aqm.conf).
# 1884 on localhost: anonymous, used only by aqm_report and aqm_netinfo.
# 1883 on all interfaces (home Wi-Fi + Tailscale): login required,
#      read-only for the phone/Mac account (see aqm.acl).
per_listener_settings true

listener 1884 127.0.0.1
allow_anonymous true

listener 1883
allow_anonymous false
password_file /etc/mosquitto/aqm.passwd
acl_file /etc/mosquitto/aqm.acl
